<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUDDAIS COLLECTION | VIP Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #008080; --bg: #fdfdfd; --text: #222; --accent: #D4AF37; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); scroll-behavior: smooth; overflow-x: hidden; }

        /* HEADER */
        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary); }
        .brand-name { font-weight: 800; font-size: 1.3rem; color: var(--primary); }
        .cart-trigger { position: relative; font-size: 1.5rem; color: var(--primary); cursor: pointer; transition: 0.3s; }
        #cart-count { position: absolute; top: -8px; right: -10px; background: #ff4757; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 50%; font-weight: bold; }

        /* SHINE ANIMATION */
        .shine { animation: shine 0.5s ease-in-out; }
        @keyframes shine { 0% { transform: scale(1); } 50% { transform: scale(1.3); color: var(--accent); } 100% { transform: scale(1); } }

        /* OFFERS */
        .offers-container { padding: 20px 4%; }
        .offer-banner { width: 100%; height: 160px; border-radius: 12px; overflow: hidden; background: #eee; }
        .offer-banner img { width: 100%; height: 100%; object-fit: cover; }

        /* TABS */
        .tabs { display: flex; overflow-x: auto; gap: 10px; padding: 15px 5%; background: #fff; border-bottom: 1px solid #eee; }
        .tab-btn { padding: 10px 22px; border: 1px solid #ddd; background: #fff; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 0.85rem; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* GRID */
        .container { padding: 20px 4%; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        /* CARD & SLIDER */
        .card { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #eee; display: flex; flex-direction: column; }
        .image-slider { position: relative; width: 100%; height: 200px; overflow: hidden; background: #f0f0f0; }
        .img-track { display: flex; width: 500%; height: 100%; transition: 0.5s ease-in-out; }
        .img-track img { width: 20%; height: 100%; object-fit: cover; }
        .card-body { padding: 10px; text-align: center; }
        .price { font-weight: 800; color: var(--primary); font-size: 1rem; margin-bottom: 10px; display: block; }
        .actions { display: flex; flex-direction: column; gap: 5px; }
        .btn { padding: 8px; border-radius: 6px; text-decoration: none; font-size: 0.75rem; font-weight: 700; text-align: center; cursor: pointer; border: none; }
        .btn-cart { background: #f8f9fa; color: #333; border: 1px solid #ddd; }
        .btn-wa { background: #25d366; color: #fff; }

        /* CART DRAWER */
        #cart-drawer { position: fixed; top: 0; right: -100%; width: 100%; max-width: 350px; height: 100%; background: #fff; z-index: 2000; box-shadow: -5px 0 20px rgba(0,0,0,0.1); transition: 0.4s; display: flex; flex-direction: column; }
        #cart-drawer.open { right: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: var(--primary); color: white; }
        .cart-content { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #f9f9f9; }
        .qty-box { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 25px; height: 25px; border-radius: 50%; border: 1px solid #ddd; background: #eee; cursor: pointer; }
        .cart-footer { padding: 20px; border-top: 1px solid #eee; }

        /* FOOTER */
        .about { background: #f0f4f4; padding: 30px; margin-top: 30px; border-radius: 15px; text-align: center; }
        footer { background: #1a1a1a; color: #fff; padding: 40px 5%; margin-top: 40px; text-align: center; }
        .footer-socials { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .wa-float { position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px; background: #25d366; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 1001; }
        #toast { display: none; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 5px; z-index: 3000; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo"><img src="Logo.jpg" alt="S" onerror="this.src='https://via.placeholder.com/50'"><span class="brand-name">SUDDAIS COLLECTION</span></a>
        <div class="cart-trigger" id="cartIcon" onclick="toggleCart()"><i class="fas fa-shopping-bag"></i><span id="cart-count">0</span></div>
    </header>

    <div class="offers-container">
        <div class="offer-banner"><img id="offerImg" src="https://via.placeholder.com/800x300?text=Special+Offers" alt="Offer"></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="filter('all')">All Products</button>
        <button class="tab-btn" onclick="filter('attar')">Attars</button>
        <button class="tab-btn" onclick="filter('perfume')">Perfumes</button>
        <button class="tab-btn" onclick="filter('kufi')">Kufi Caps</button>
    </div>

    <div class="container">
        <div class="grid" id="productGrid"></div>
        <section class="about"><h3>About Suddais Collection</h3><p>ہم بہترین کوالٹی کے عطر اور ٹوپیاں فراہم کرتے ہیں۔</p></section>
    </div>

    <div id="cart-drawer">
        <div class="cart-header"><h3>Shopping Cart</h3><i class="fas fa-times" onclick="toggleCart()" style="cursor:pointer"></i></div>
        <div class="cart-content" id="cartContent"></div>
        <div class="cart-footer">
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:15px;"><span>Total:</span><span id="totalPrice">Rs. 0</span></div>
            <button class="btn btn-wa" style="width:100%" onclick="sendOrder()">ORDER ON WHATSAPP</button>
        </div>
    </div>

    <div id="toast">Added to Cart! 🛍️</div>
    <div class="wa-float" onclick="window.open('https://wa.me/923182187575')"><i class="fab fa-whatsapp"></i></div>

    <footer>
        <div class="footer-socials"><a href="#"><i class="fab fa-facebook"></i></a><a href="#"><i class="fab fa-instagram"></i></a><a href="https://wa.me/923182187575"><i class="fab fa-whatsapp"></i></a></div>
        <p>&copy; 2026 SUDDAIS COLLECTION</p>
    </footer>

    <script>
        const offers = ['https://via.placeholder.com/800x300?text=Summer+Sale', 'https://via.placeholder.com/800x300?text=Premium+Collection'];
        let currentOffer = 0; setInterval(() => { currentOffer = (currentOffer + 1) % offers.length; document.getElementById('offerImg').src = offers[currentOffer]; }, 4000);
        
        const products = []; let cart = []; const cats = ['attar', 'perfume', 'kufi'];
        for(let i=1; i<=30; i++) {
            let cat = cats[(i-1)%3];
            products.push({ id: i, category: cat, name: (cat=='attar'?'Royal Oud':cat=='perfume'?'Elite Scent':'Premium Kufi')+' #'+i, price: 1000+(i*100), imgs: ['https://via.placeholder.com/300x400'] });
        }

        function render(f='all') {
            const grid = document.getElementById('productGrid'); grid.innerHTML = '';
            products.filter(p => f==='all'||p.category===f).forEach(p => {
                grid.innerHTML += `<div class="card"><div class="image-slider"><div class="img-track"><img src="${p.imgs[0]}"></div></div><div class="card-body"><h3>${p.name}</h3><span class="price">Rs. ${p.price}</span><div class="actions"><button class="btn btn-cart" onclick="addToCart(${p.id})">ADD TO CART</button><a href="https://wa.me/923182187575?text=Order: ${p.name}" class="btn btn-wa">WHATSAPP</a></div></div></div>`;
            });
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id); const inCart = cart.find(item => item.id === id);
            if(inCart) inCart.qty++; else cart.push({...prod, qty: 1});
            const icon = document.getElementById('cartIcon'); icon.classList.add('shine'); setTimeout(() => icon.classList.remove('shine'), 500);
            showToast(); updateCartUI();
        }

        function updateCartUI() {
            const content = document.getElementById('cartContent'), count = document.getElementById('cart-count'), total = document.getElementById('totalPrice');
            if(cart.length === 0) { content.innerHTML = '<p style="text-align:center">Your cart is empty!</p>'; count.innerText = 0; total.innerText = 'Rs. 0'; return; }
            let sum = 0;
            content.innerHTML = cart.map(item => { sum += item.price * item.qty; return `<div class="cart-item"><div><h4>${item.name}</h4><small>Rs. ${item.price}</small></div><div class="qty-box"><button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button><span>${item.qty}</span><button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button></div></div>`; }).join('');
            count.innerText = cart.length; total.innerText = 'Rs. ' + sum;
        }

        function changeQty(id, delta) {
            const item = cart.find(x => x.id === id); item.qty += delta;
            if(item.qty < 1) cart = cart.filter(x => x.id !== id);
            updateCartUI();
        }

        function toggleCart() { document.getElementById('cart-drawer').classList.toggle('open'); }
        function showToast() { const t = document.getElementById('toast'); t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }
        function filter(c) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); render(c); }
        function sendOrder() {
            let msg = "Assalam-o-Alaikum, I want to order:\n"; cart.forEach(i => msg += `• ${i.name} (Qty: ${i.qty})\n`);
            window.open(`https://wa.me/923182187575?text=${encodeURIComponent(msg)}`);
        }
        render();
    </script>
</body>
</html>
